name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run regression tests
        run: npm test

      - name: Run TypeScript
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Apply complete migration chain
        run: supabase db reset --local --no-seed

      - name: Capture first public schema
        run: supabase db dump --local --schema public --file /tmp/schema-first.sql

      - name: Recreate and replay complete migration chain
        run: supabase db reset --local --no-seed

      - name: Capture replayed public schema
        run: supabase db dump --local --schema public --file /tmp/schema-replay.sql

      - name: Verify deterministic replay
        run: diff --unified /tmp/schema-first.sql /tmp/schema-replay.sql

      - name: Lint rehearsed database
        run: supabase db lint --local --level error

      - name: Destroy disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
