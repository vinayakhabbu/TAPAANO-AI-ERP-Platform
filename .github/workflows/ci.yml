name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  railway-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify the Railway production container
        run: node --test tests/hosting/railway-container.test.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      finance-regressions:
        image: postgres:17
        env:
          POSTGRES_DB: tapaano_regression_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_regression_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tapaano_regression_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAPAANO_TEST_DATABASE_URL: postgres://postgres:synthetic_regression_password@127.0.0.1:5432/tapaano_regression_fixture
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run regression tests
        run: npm test

      - name: Run TypeScript
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify release artifact with synthetic public configuration
        env:
          VITE_SUPABASE_URL: https://ci-release-validation.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: npm run build:release

  migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Use pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Apply complete migration chain
        run: supabase db reset --local --no-seed

      - name: Capture first public schema
        run: supabase db dump --local --schema public --file /tmp/schema-first.sql

      - name: Recreate and replay complete migration chain
        run: supabase db reset --local --no-seed

      - name: Capture replayed public schema
        run: supabase db dump --local --schema public --file /tmp/schema-replay.sql

      - name: Verify deterministic replay
        run: diff --unified /tmp/schema-first.sql /tmp/schema-replay.sql

      - name: Lint rehearsed database
        run: supabase db lint --local --level error

      - name: Verify authenticated API, browser, concurrency and populated recovery
        run: npm run test:integration

      - name: Retain sanitized recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-evidence
          path: test-results/recovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Destroy disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
